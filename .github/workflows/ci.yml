name: EduCast CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classhub_admin
          POSTGRES_PASSWORD: supersecure_password_2026
          POSTGRES_DB: classhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://classhub_admin:supersecure_password_2026@localhost:5432/classhub?schema=public"
      JWT_ACCESS_SECRET: "ci_test_access_secret_key"
      JWT_REFRESH_SECRET: "ci_test_refresh_secret_key"
      PORT: 5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Root & Workspace Dependencies
        run: |
          npm install
          cd server && npm install
          cd ../client && npm install

      - name: Synchronize Database Schema
        run: |
          cd server
          node prisma/prepare-db.js --push

      - name: Run Phase 1 Integration Verification Suite
        run: |
          cd server
          node src/test_phase1.js

      - name: Run Phase 2 Socket.IO & WebRTC Integration Suite
        run: |
          cd server
          node src/test_phase2.js

      - name: Run Phase 3 & 4 Analytics & VOD Integration Suite
        run: |
          cd server
          node src/test_phase3_4.js

      - name: Build Frontend Client Bundle
        run: |
          cd client
          npm run build
