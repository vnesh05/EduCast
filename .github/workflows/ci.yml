name: EduCast CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Root & Workspace Dependencies
        run: |
          npm install
          cd server && npm install
          cd ../client && npm install

      - name: Push Prisma Schema (Test DB)
        run: |
          cd server
          npx prisma db push

      - name: Run Phase 1 Integration Verification Suite
        run: |
          cd server
          node src/test_phase1.js

      - name: Run Phase 2 Socket.IO & WebRTC Integration Suite
        run: |
          cd server
          node src/test_phase2.js

      - name: Build Frontend Client Bundle
        run: |
          cd client
          npm run build
